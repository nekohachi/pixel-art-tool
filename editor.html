<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ドット絵エディタ</title>
<meta name="theme-color" content="#1b1d23">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<style>
  :root{
    --bg:#1b1d23; --panel:#24272f; --panel2:#2c2f38; --panel3:#343845;
    --border:#3a3e49; --text:#e6e8ee; --muted:#9aa0ad;
    --accent:#5b8cff; --accent2:#41c98a; --danger:#e0596b;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Yu Gothic UI",system-ui,sans-serif;font-size:13px;
    overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
  body{display:flex;flex-direction:column;overflow:hidden;
    padding-top:var(--safe-t);padding-bottom:var(--safe-b);}
  button{font-family:inherit;color:inherit;}

  header{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;
    background:var(--panel);border-bottom:1px solid var(--border);}
  header h1{font-size:14px;margin:0;font-weight:600;white-space:nowrap;}
  header h1 small{color:var(--muted);font-weight:400;font-size:11px;}
  .grow{flex:1;}
  .hbtn{border:1px solid var(--border);background:var(--panel2);border-radius:7px;
    padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .hbtn:active{background:var(--panel3);}
  .hbtn.icon{padding:6px 9px;}

  #workspace{flex:1;min-height:0;position:relative;overflow:hidden;}

  /* Floating panels (Photoshop-style: drag by the grip, long-press to move) */
  .panel{position:absolute;z-index:20;display:flex;flex-direction:column;
    border:1px solid var(--border);border-radius:0;background:var(--panel);
    box-shadow:0 3px 14px #0006;overflow:hidden;max-width:100%;}
  .panel.dragging{z-index:45;box-shadow:0 10px 32px #000a;opacity:.97;}
  .pgrip{flex:none;height:20px;display:flex;align-items:center;justify-content:center;gap:4px;
    background:var(--panel3);color:var(--muted);font-size:11px;cursor:grab;touch-action:none;
    user-select:none;letter-spacing:1px;border-bottom:1px solid var(--border);}
  .pgrip:active{cursor:grabbing;}
  .presize{flex:none;height:8px;cursor:ns-resize;touch-action:none;background:var(--panel3);
    border-bottom:1px solid var(--border);}
  .presize::after{content:"";display:block;width:38px;height:3px;border-radius:2px;
    background:var(--border);margin:2px auto 0;}
  /* Panel resize handle (bottom inner corner) */
  .prz{position:absolute;width:20px;height:20px;z-index:6;touch-action:none;
    background:linear-gradient(135deg,transparent 45%,var(--muted) 45%,var(--muted) 55%,transparent 55%,transparent 70%,var(--muted) 70%,var(--muted) 80%,transparent 80%);}
  .prz.br{right:0;bottom:0;cursor:nwse-resize;}
  .prz.bl{left:0;bottom:0;cursor:nesw-resize;transform:scaleX(-1);}
  #pnlTools .tools,#pnlSide .side,#pnlGauge .gauge{border:none;}
  #pnlGauge{width:52px;}
  #pnlTl .timeline{max-height:none;height:100%;flex:1;min-height:0;}

  /* Brush gauge (Procreate style) */
  .gauge{flex:1;min-height:0;width:100%;background:var(--panel);
    display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:8px;
    touch-action:none;}
  .gauge .g-icon{font-size:15px;opacity:.8;}
  .gauge .g-val{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;
    background:var(--panel3);border-radius:6px;padding:2px 0;width:34px;text-align:center;}
  .gauge .gtool{width:40px;height:40px;border:1px solid var(--border);background:var(--panel2);
    border-radius:9px;font-size:20px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;}
  .gauge .gtool.active{background:var(--accent);border-color:var(--accent);}
  .g-track{flex:1;width:20px;border-radius:12px;background:var(--panel3);
    position:relative;overflow:hidden;margin:4px 0;box-shadow:inset 0 0 0 1px var(--border);
    touch-action:none;cursor:ns-resize;}
  .g-fill{position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(var(--accent2),var(--accent));}
  .g-dot{position:absolute;left:50%;transform:translate(-50%,50%);width:26px;height:26px;
    border-radius:50%;background:#fff;box-shadow:0 1px 4px #000a;pointer-events:none;
    border:2px solid var(--accent);}

  /* Canvas */
  .stage{position:absolute;inset:0;overflow:hidden;background:#15161b;touch-action:none;z-index:0;}
  #view{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;}
  .gauge .gshape{width:34px;height:30px;border:1px solid var(--border);background:var(--panel2);
    border-radius:6px;font-size:16px;cursor:pointer;flex:none;padding:0;color:var(--text);}
  .brushcursor.round{border-radius:50%;}
  .brushcursor{position:absolute;pointer-events:none;border:1px solid #fff;
    box-shadow:0 0 0 1px #000;display:none;z-index:5;mix-blend-mode:difference;}
  /* Eyedropper loupe */
  .loupe{position:fixed;z-index:70;display:none;pointer-events:none;width:132px;
    flex-direction:column;align-items:center;}
  .loupe.show{display:flex;}
  .loupe canvas{width:132px;height:132px;border-radius:50%;image-rendering:pixelated;
    box-shadow:0 6px 24px #000b, 0 0 0 4px var(--panel3);background:#000;}
  .loupe-ring{position:absolute;top:0;width:132px;height:132px;border-radius:50%;
    border:3px solid #fff;box-shadow:inset 0 0 0 1px #0008;}
  .loupe-info{margin-top:8px;display:flex;align-items:center;gap:6px;background:#000c;
    border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:12px;
    font-variant-numeric:tabular-nums;}
  .loupe-info i{width:16px;height:16px;border-radius:4px;box-shadow:0 0 0 1px #fff6;}

  /* Panel contents */
  .side{width:196px;background:var(--panel);
    display:flex;flex-direction:column;min-height:0;overflow-y:auto;flex:1;}
  .tools{width:100%;background:var(--panel);
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;overflow-y:auto;flex:1;min-height:0;}
  .tool{width:42px;height:40px;border:1px solid transparent;background:transparent;
    border-radius:8px;font-size:19px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;flex:none;}
  .tool.active{background:var(--accent);border-color:var(--accent);}
  .tool:active{background:var(--panel3);}
  .tool.on{background:var(--accent2);border-color:var(--accent2);}
  .tsep{width:34px;height:1px;background:var(--border);margin:2px 0;flex:none;}

  .sec{border-bottom:1px solid var(--border);padding:8px;}
  .sec h3{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;display:flex;align-items:center;gap:6px;}
  .minibtn{border:1px solid var(--border);background:var(--panel2);border-radius:6px;
    min-width:26px;height:24px;font-size:13px;cursor:pointer;padding:0 4px;line-height:1;}
  .minibtn:active{background:var(--panel3);}
  .minibtn.on{background:var(--accent2);border-color:var(--accent2);}
  .minibtn.danger:active{background:var(--danger);}

  .colrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .swatch{width:34px;height:34px;border-radius:8px;border:2px solid var(--border);flex:none;
    background-image:linear-gradient(45deg,#555 25%,transparent 25%),linear-gradient(-45deg,#555 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#555 75%),linear-gradient(-45deg,transparent 75%,#555 75%);
    background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;}
  .swatch>i{display:block;width:100%;height:100%;border-radius:5px;}
  .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;}
  .pcell{aspect-ratio:1;border-radius:4px;cursor:pointer;border:2px solid transparent;}
  .pcell.active{border-color:#fff;box-shadow:0 0 0 1px #000;}
  .pcell.transp{background-image:linear-gradient(45deg,#555 25%,transparent 25%),linear-gradient(-45deg,#555 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#555 75%),linear-gradient(-45deg,transparent 75%,#555 75%);
    background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0;}

  .field{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px;}
  .field label{color:var(--muted);min-width:42px;}
  .field input[type=range]{flex:1;min-width:0;}
  input[type=color]{width:30px;height:26px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);padding:0;}
  .selmodes{display:flex;gap:6px;}
  .selmodes .minibtn{flex:1;height:28px;}
  /* Floating +/- selection modifier buttons beside the left gauge */
  .selmod{position:absolute;left:132px;top:50%;transform:translateY(-50%);z-index:15;
    display:none;flex-direction:column;gap:12px;touch-action:none;}
  .selmod.show{display:flex;}
  .selmod button{width:50px;height:50px;border-radius:50%;border:2px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:26px;line-height:1;font-weight:600;
    box-shadow:0 3px 10px #0008;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .selmod button.on{background:var(--accent2);border-color:#fff;color:#fff;box-shadow:0 0 0 3px var(--accent2),0 3px 10px #0008;}
  .selmod .cap{font-size:10px;color:var(--muted);text-align:center;margin-top:3px;text-shadow:0 1px 3px #000;}
  /* D-pad to nudge the selection by 1px */
  .nudge{position:absolute;left:132px;bottom:14px;z-index:15;display:none;
    grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:5px;}
  .nudge.show{display:grid;}
  .nudge .nu{border-radius:10px;border:2px solid var(--border);background:var(--panel2);
    color:var(--text);font-size:18px;box-shadow:0 3px 10px #0008;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .nudge .nu:active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .nudge .up{grid-area:1/2}.nudge .left{grid-area:2/1}.nudge .mid{grid-area:2/2;
    border:none;background:transparent;box-shadow:none;font-size:9px;color:var(--muted);pointer-events:none;}
  .nudge .right{grid-area:2/3}.nudge .down{grid-area:3/2}
  /* Selection delete button: top-left, red, away from the +/- and D-pad */
  .seldel{position:absolute;left:132px;top:12px;z-index:15;display:none;
    width:50px;height:50px;border-radius:50%;border:2px solid var(--danger);
    background:var(--panel2);color:var(--danger);font-size:22px;cursor:pointer;
    box-shadow:0 3px 10px #0008;align-items:center;justify-content:center;}
  .seldel.show{display:flex;}
  .seldel:active{background:var(--danger);color:#fff;}
  @media (max-width:760px){.selmod{left:120px;} .nudge{left:120px;} .seldel{left:120px;}}

  /* Aseprite-style timeline */
  .timeline{background:var(--panel);display:flex;flex-direction:column;min-height:0;}
  .tl-ctrls{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);
    overflow-x:auto;}
  .tl-ctrls .vsep{width:1px;height:22px;background:var(--border);margin:0 3px;flex:none;}
  .tl-ctrls .lbl{color:var(--muted);font-size:11px;flex:none;white-space:nowrap;}
  .playbtn{flex:none;width:52px;height:36px;border:1px solid var(--accent);background:var(--accent);
    color:#fff;border-radius:9px;font-size:18px;cursor:pointer;line-height:1;}
  .playbtn:active{filter:brightness(1.15);}
  .playbtn.playing{background:var(--panel3);border-color:var(--border);}
  .fps-slider{flex:none;width:120px;height:30px;}
  .dellabel{width:auto;padding:0 8px;height:30px;font-size:12px;flex:none;}
  /* Layer controls live in the timeline corner, above the layer column */
  .tl-corner{display:flex;align-items:stretch;}
  .corner-btn{flex:1;min-width:0;border:none;border-right:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:15px;cursor:pointer;line-height:1;padding:0;}
  .corner-btn:active{background:var(--panel3);}
  .tl-scroll{overflow:auto;flex:1;}
  .tl-grid{display:inline-block;min-width:100%;}
  .tl-row{display:flex;align-items:stretch;}
  .tl-head{position:sticky;top:0;z-index:3;background:var(--panel);}
  .tl-corner{width:118px;flex:none;position:sticky;left:0;z-index:4;background:var(--panel);
    border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
  .tl-fnum{width:44px;flex:none;text-align:center;font-size:11px;color:var(--muted);
    padding:9px 0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    cursor:grab;touch-action:none;}
  .tl-fnum.active{background:var(--accent);color:#fff;}
  .tl-lhead{width:118px;flex:none;position:sticky;left:0;z-index:2;background:var(--panel2);
    display:flex;align-items:center;gap:1px;padding:0 3px;border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);cursor:pointer;height:46px;}
  .tl-lhead.active{background:var(--panel3);box-shadow:inset 3px 0 0 var(--accent);}
  .tl-lhead .grip{width:24px;flex:none;text-align:center;cursor:grab;touch-action:none;
    color:var(--muted);font-size:17px;line-height:1;align-self:stretch;display:flex;align-items:center;justify-content:center;}
  .tl-lhead .eye,.tl-lhead .lock{font-size:13px;width:19px;text-align:center;flex:none;cursor:pointer;}
  .tl-lhead .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;outline:none;}
  .tl-lhead.drag,.tl-fnum.drag{opacity:.35;}
  .tl-ghost{position:fixed;z-index:100;pointer-events:none;background:var(--panel3);
    border:1px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:12px;
    box-shadow:0 6px 20px #000a;max-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .tl-drop{position:fixed;z-index:99;background:var(--accent);pointer-events:none;border-radius:2px;
    box-shadow:0 0 6px var(--accent);}
  .tl-cell{width:44px;height:46px;flex:none;border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);cursor:pointer;background:#0e0f13;
    display:flex;align-items:center;justify-content:center;padding:3px;}
  .tl-cell.active{box-shadow:inset 0 0 0 2px var(--accent);}
  .tl-cell canvas{max-width:100%;max-height:100%;image-rendering:pixelated;
    background-image:linear-gradient(45deg,#3a3a3a 25%,transparent 25%),linear-gradient(-45deg,#3a3a3a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3a3a3a 75%),linear-gradient(-45deg,transparent 75%,#3a3a3a 75%);
    background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0;}

  /* Mobile bottom bar */
  .mbar{display:none;flex:none;background:var(--panel);border-top:1px solid var(--border);padding:6px;gap:6px;align-items:center;overflow-x:auto;}
  .mbar .hbtn{flex:none;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;align-items:center;justify-content:center;padding:16px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;width:100%;max-width:340px;max-height:85vh;overflow-y:auto;}
  .modal h2{margin:0 0 12px;font-size:15px;}
  .modal .field label{min-width:80px;}
  .modal .row{display:flex;gap:8px;margin-top:14px;}
  .modal .row .hbtn{flex:1;text-align:center;justify-content:center;}
  .modal .hbtn.primary{background:var(--accent);border-color:var(--accent);}
  .num{width:64px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 7px;font-size:13px;}
  .preset{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .preset .hbtn{padding:5px 8px;font-size:12px;}

  .toast{position:fixed;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);
    background:#000c;border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;}

  #pnlSide.hidden{display:none;}
  /* Color wheel */
  .wheelwrap{position:relative;width:100%;display:flex;justify-content:center;}
  #colorWheel{width:100%;max-width:180px;height:auto;aspect-ratio:1;touch-action:none;cursor:crosshair;}
  .wheel-cursor{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1px #000,0 1px 3px #000a;transform:translate(-50%,-50%);pointer-events:none;}
  .dockprev{position:absolute;z-index:44;pointer-events:none;display:none;
    background:rgba(91,140,255,.22);border:2px solid var(--accent);border-radius:10px;
    box-shadow:inset 0 0 0 2px rgba(91,140,255,.3);}
  .dockprev.show{display:block;}
  @media (max-width:760px){
    .mbar{display:flex;}
    .tool{width:38px;height:38px;font-size:18px;}
  }
</style>
</head>
<body>
<header>
  <h1>✏️ ドット絵エディタ <small id="docsize">32×32</small></h1>
  <span class="grow"></span>
  <button class="hbtn icon" id="undoBtn" title="元に戻す">↶</button>
  <button class="hbtn icon" id="redoBtn" title="やり直し">↷</button>
  <button class="hbtn" id="menuBtn" title="メニュー">☰</button>
</header>

<div id="workspace">
  <!-- Canvas (fills the workspace; panels float above) -->
  <div class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="brushcursor" id="brushcursor"></div>
  </div>

  <!-- Docking drop-zone preview -->
  <div class="dockprev" id="dockPrev"></div>

  <!-- Floating selection modifier buttons (Ctrl/Alt equivalents) -->
  <div class="selmod" id="selMod">
    <div>
      <button id="selPlus" title="選択に追加：押しながら選択／タップでロック">＋</button>
      <div class="cap">追加</div>
    </div>
    <div>
      <button id="selMinus" title="選択から除外：押しながら選択／タップでロック">−</button>
      <div class="cap">除外</div>
    </div>
  </div>
  <button class="seldel" id="selDel" title="選択範囲を削除（元に戻す/2本指タップで復帰）">🗑</button>
  <div class="nudge" id="nudge">
    <button class="nu up" data-dx="0" data-dy="-1" title="上へ1px">▲</button>
    <button class="nu left" data-dx="-1" data-dy="0" title="左へ1px">◀</button>
    <span class="nu mid">1px</span>
    <button class="nu right" data-dx="1" data-dy="0" title="右へ1px">▶</button>
    <button class="nu down" data-dx="0" data-dy="1" title="下へ1px">▼</button>
  </div>

  <!-- Brush-size gauge panel -->
  <div class="panel" id="pnlGauge">
    <div class="pgrip">⠿ サイズ</div>
    <div class="gauge" id="gauge">
      <span class="g-icon">⬤</span>
      <div class="g-track" id="gtrack"><div class="g-fill" id="gfill"></div><div class="g-dot" id="gdot"></div></div>
      <span class="g-val" id="gval">1</span>
      <button class="gshape" id="brushShapeBtn" title="ブラシ形状（四角／円）">◻</button>
    </div>
  </div>

  <!-- Tool rail panel -->
  <div class="panel" id="pnlTools">
    <div class="pgrip">⠿ ツール</div>
    <div class="tools" id="tools">
      <button class="tool active" data-tool="pencil" title="ペン (B)">✏️</button>
      <button class="tool" data-tool="eraser" title="消しゴム (E)">🧽</button>
      <button class="tool" data-tool="bucket" title="塗りつぶし (G)">🪣</button>
      <button class="tool" data-tool="line" title="直線 (L)">📏</button>
      <button class="tool" data-tool="rect" title="矩形 (U)">▭</button>
      <button class="tool" data-tool="ellipse" title="楕円 (O)">⬭</button>
      <button class="tool" data-tool="dropper" title="スポイト (I)">💧</button>
      <div class="tsep"></div>
      <button class="tool" data-tool="select" title="矩形選択 (M)">⬚</button>
      <button class="tool" data-tool="lasso" title="投げ縄 (Q)">🪢</button>
      <button class="tool" data-tool="wand" title="自動選択 (W)">🪄</button>
      <button class="tool" data-tool="quick" title="クイック選択（なぞって似た色を選択・A）">🖌️</button>
      <button class="tool" data-tool="range" title="色域選択（タップした色を全体から選択・K）">🎯</button>
      <div class="tsep"></div>
      <button class="tool" data-tool="move" title="移動 (V)">✥</button>
      <button class="tool" data-tool="hand" title="手のひら (H)">✋</button>
      <button class="tool" data-tool="mirror" title="左右対称">🔀</button>
    </div>
  </div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let TOAST_T;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(TOAST_T);TOAST_T=setTimeout(()=>t.classList.remove('show'),1600);}
function rgba(r,g,b,a){return ((a<<24)|(b<<16)|(g<<8)|r)>>>0;}
function packHex(hex,a=255){const n=parseInt(hex.slice(1),16);return rgba((n>>16)&255,(n>>8)&255,n&255,a);}
function toHex(px){const r=px&255,g=(px>>8)&255,b=(px>>16)&255;return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}
function alphaOf(px){return (px>>>24)&255;}

/* ================= Document ================= */
let doc, W, H;
let activeLayer=0, activeFrame=0, nextId=1;
const uid=()=>nextId++;
const MAXBRUSH=32;
function newCel(){return new Uint32Array(W*H);}
function celKey(l,f){return l+':'+f;}
function getCel(layerIdx,frameIdx){
  const id=doc.layers[layerIdx].id, k=celKey(id,frameIdx);
  let c=doc.cels.get(k); if(!c){c=newCel();doc.cels.set(k,c);} return c;
}
function activeCel(){return getCel(activeLayer,activeFrame);}

function newDoc(w,h){
  W=w;H=h;
  doc={layers:[{id:uid(),name:'レイヤー 1',visible:true,opacity:255,locked:false}],
       frames:[{id:uid(),duration:125}], cels:new Map()};
  activeLayer=0;activeFrame=0;undoStack=[];redoStack=[];selection=null;
  $('#docsize').textContent=W+'×'+H;
  ensureComp();fitView();buildPalette();refreshTimeline();render();updateUndoUI();
}

/* ================= History ================= */
let undoStack=[], redoStack=[];
const HISTORY_MAX=40;
function snapshot(){
  const cels={};doc.cels.forEach((v,k)=>{cels[k]=v.slice();});
  return {W,H,layers:JSON.parse(JSON.stringify(doc.layers)),
    frames:JSON.parse(JSON.stringify(doc.frames)),cels,activeLayer,activeFrame,
    sel:selection?selection.mask.slice():null};
}
function restore(s){
  W=s.W;H=s.H;
  doc.layers=JSON.parse(JSON.stringify(s.layers));
  doc.frames=JSON.parse(JSON.stringify(s.frames));
  doc.cels=new Map();for(const k in s.cels)doc.cels.set(k,s.cels[k].slice());
  activeLayer=Math.min(s.activeLayer,doc.layers.length-1);
  activeFrame=Math.min(s.activeFrame,doc.frames.length-1);
  // selection is part of history: restore it (guarded to current size)
  if(s.sel&&s.sel.length===W*H){selection={mask:s.sel.slice()};computeSelBounds();}
  else selection=null;
  $('#docsize').textContent=W+'×'+H;ensureComp();refreshTimeline();render();
}
let lastClearedRedo=[];
function pushUndo(){undoStack.push(snapshot());if(undoStack.length>HISTORY_MAX)undoStack.shift();lastClearedRedo=redoStack;redoStack=[];updateUndoUI();}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());updateUndoUI();toast('元に戻す');}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());updateUndoUI();toast('やり直し');}
function updateUndoUI(){$('#undoBtn').style.opacity=undoStack.length?1:.4;$('#redoBtn').style.opacity=redoStack.length?1:.4;}

/* ================= View ================= */
const stage=$('#stage'), view=$('#view'), vctx=view.getContext('2d');
let zoom=8, panX=0, panY=0;
let comp=document.createElement('canvas'), cctx;
function ensureComp(){comp.width=W;comp.height=H;cctx=comp.getContext('2d');}
function fitView(){
  const rect=stage.getBoundingClientRect();
  zoom=Math.max(1,Math.floor(Math.min(rect.width/W,rect.height/H)*0.9));
  panX=Math.round((rect.width-W*zoom)/2);panY=Math.round((rect.height-H*zoom)/2);
}
function screenToPix(sx,sy){
  const rect=stage.getBoundingClientRect();
  return {x:Math.floor((sx-rect.left-panX)/zoom),y:Math.floor((sy-rect.top-panY)/zoom)};
}
let onion=false, showGridFlag=false;
function blend(dst,src,srcA){
  const sr=src&255,sg=(src>>8)&255,sb=(src>>16)&255;
  const dr=dst&255,dg=(dst>>8)&255,db=(dst>>16)&255,da=(dst>>>24)&255;
  const outA=srcA+da*(255-srcA)/255;
  if(outA<=0)return 0;
  const r=(sr*srcA+dr*da*(255-srcA)/255)/outA;
  const g=(sg*srcA+dg*da*(255-srcA)/255)/outA;
  const b=(sb*srcA+db*da*(255-srcA)/255)/outA;
  return rgba(r|0,g|0,b|0,Math.round(outA));
}
function compositeFrame(frameIdx,ctxTarget){
  const out=new Uint32Array(W*H);
  for(let li=0;li<doc.layers.length;li++){
    const L=doc.layers[li];if(!L.visible)continue;
    const cel=doc.cels.get(celKey(L.id,frameIdx));if(!cel)continue;
    const la=L.opacity;
    for(let i=0;i<out.length;i++){
      const s=cel[i];const sa=(s>>>24)&255;if(!sa)continue;
      const a=Math.round(sa*la/255);if(!a)continue;
      out[i]=blend(out[i],s,a);
    }
  }
  ctxTarget.putImageData(new ImageData(new Uint8ClampedArray(out.buffer),W,H),0,0);
}
// render() = recomposite then paint (use after any pixel/layer/frame change).
// renderView() = paint only, reusing the cached composite (use for pan/zoom/
// selection animation) so view changes stay O(1) on big canvases.
let compDirty=true;
function render(){compDirty=true;paintView();}
function renderView(){paintView();}
function paintView(){
  const rect=stage.getBoundingClientRect();
  if(view.width!==rect.width||view.height!==rect.height){view.width=rect.width;view.height=rect.height;}
  else vctx.clearRect(0,0,view.width,view.height);
  vctx.imageSmoothingEnabled=false;
  drawChecker();
  if(onion){
    if(activeFrame>0)drawFrameLayer(activeFrame-1,.28);
    if(activeFrame<doc.frames.length-1)drawFrameLayer(activeFrame+1,.28);
  }
  if(compDirty){compositeFrame(activeFrame,cctx);compDirty=false;}
  vctx.imageSmoothingEnabled=false;
  vctx.drawImage(comp,0,0,W,H,panX,panY,W*zoom,H*zoom);
  if(previewCel){
    const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;
    tmp.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(previewCel.buffer),W,H),0,0);
    vctx.drawImage(tmp,0,0,W,H,panX,panY,W*zoom,H*zoom);
  }
  if(showGridFlag&&zoom>=6)drawGrid();
  drawSelectionOverlay();
  updateSelModVisible();
}
function drawFrameLayer(fi,alpha){
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;
  compositeFrame(fi,tmp.getContext('2d'));
  vctx.globalAlpha=alpha;vctx.drawImage(tmp,0,0,W,H,panX,panY,W*zoom,H*zoom);vctx.globalAlpha=1;
}
// Cached, screen-fixed transparency checker (one fillRect per paint).
let checkerPat=null;
function drawChecker(){
  if(!checkerPat){const s=16,t=document.createElement('canvas');t.width=s;t.height=s;const tc=t.getContext('2d');
    tc.fillStyle='#2b2d34';tc.fillRect(0,0,s,s);
    tc.fillStyle='#23252b';tc.fillRect(0,0,s/2,s/2);tc.fillRect(s/2,s/2,s/2,s/2);
    checkerPat=vctx.createPattern(t,'repeat');}
  vctx.fillStyle=checkerPat;vctx.fillRect(panX,panY,W*zoom,H*zoom);
}
function drawGrid(){
  vctx.strokeStyle='rgba(255,255,255,.12)';vctx.lineWidth=1;vctx.beginPath();
  for(let x=0;x<=W;x++){const px=Math.round(panX+x*zoom)+.5;vctx.moveTo(px,panY);vctx.lineTo(px,panY+H*zoom);}
  for(let y=0;y<=H;y++){const py=Math.round(panY+y*zoom)+.5;vctx.moveTo(panX,py);vctx.lineTo(panX+W*zoom,py);}
  vctx.stroke();
}

/* ================= Selection (mask based) ================= */
// selection = { mask:Uint8Array(W*H), bounds:{x0,y0,x1,y1} } | null
let selection=null;
let stickySel='replace';    // replace | add | subtract  (tap-locked)
let selHold=null;           // 'add' | 'subtract'         (while +/- held)
let curSelMode='replace';
function selBuf(){return new Uint8Array(W*H);}
function hasSel(){return !!selection;}
function inSelection(x,y){if(!selection)return true;return !!selection.mask[y*W+x];}
function selModeFrom(e){
  if(e&&(e.ctrlKey||e.metaKey))return 'add';
  if(e&&e.altKey)return 'subtract';
  if(selHold)return selHold;      // finger held on +/- button
  return stickySel;               // tap-locked mode
}
function applyShape(shp,mode){
  if(mode==='add'){
    if(!selection)selection={mask:shp};
    else for(let i=0;i<shp.length;i++)if(shp[i])selection.mask[i]=1;
  }else if(mode==='subtract'){
    if(selection)for(let i=0;i<shp.length;i++)if(shp[i])selection.mask[i]=0;
  }else{selection={mask:shp};}
  if(selection){let any=false;for(let i=0;i<selection.mask.length;i++)if(selection.mask[i]){any=true;break;}
    if(!any)selection=null;}
  computeSelBounds();
}
function computeSelBounds(){
  if(!selection)return;
  let x0=W,y0=H,x1=-1,y1=-1;const m=selection.mask;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(m[y*W+x]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  selection.bounds={x0,y0,x1,y1};
}
function rectShape(x0,y0,x1,y1){
  const shp=selBuf();
  const xa=clampX(Math.min(x0,x1)),xb=clampX(Math.max(x0,x1)),ya=clampY(Math.min(y0,y1)),yb=clampY(Math.max(y0,y1));
  for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++)shp[y*W+x]=1;
  return shp;
}
function lassoShape(pts){
  const shp=selBuf();
  if(pts.length<3){if(pts.length){const p=pts[0];if(inBounds(p.x,p.y))shp[p.y*W+p.x]=1;}return shp;}
  let minY=H,maxY=0;for(const p of pts){if(p.y<minY)minY=p.y;if(p.y>maxY)maxY=p.y;}
  minY=clampY(minY);maxY=clampY(maxY);
  for(let y=minY;y<=maxY;y++){
    const xs=[];const yy=y+0.5;
    for(let i=0;i<pts.length;i++){
      const a=pts[i],b=pts[(i+1)%pts.length];
      if((a.y<=yy&&b.y>yy)||(b.y<=yy&&a.y>yy))xs.push(a.x+(yy-a.y)/(b.y-a.y)*(b.x-a.x));
    }
    xs.sort((p,q)=>p-q);
    for(let i=0;i+1<xs.length;i+=2){
      const xa=Math.round(xs[i]),xb=Math.round(xs[i+1]);
      for(let x=Math.max(0,xa);x<=Math.min(W-1,xb);x++)shp[y*W+x]=1;
    }
  }
  for(const p of pts)if(inBounds(p.x,p.y))shp[p.y*W+p.x]=1;
  return shp;
}
function wandShape(x,y){
  const shp=selBuf();if(!inBounds(x,y))return shp;
  const cel=activeCel();const target=cel[y*W+x];const st=[[x,y]];
  while(st.length){const[cx,cy]=st.pop();if(!inBounds(cx,cy))continue;
    const i=cy*W+cx;if(shp[i])continue;if(cel[i]!==target)continue;
    shp[i]=1;st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);}
  return shp;
}
// Quick selection: brush over the canvas to grow the selection to contiguous
// pixels of a similar color. Works with the +/- (add/subtract) modes.
let qLast=null, quickSubtract=false, rangeTol=48, lastRange=null;
function colorClose(a,b,tol){
  const t=(tol==null?rangeTol:tol);
  const aa=(a>>>24)&255, ba=(b>>>24)&255;
  if(aa===0||ba===0)return aa===ba;   // transparent matches only transparent
  const dr=(a&255)-(b&255),dg=((a>>8)&255)-((b>>8)&255),db=((a>>16)&255)-((b>>16)&255);
  return dr*dr+dg*dg+db*db<=t*t;
}
// Color-range selection: select ALL pixels of a similar color (non-contiguous).
function rangeShape(x,y){
  const shp=selBuf();if(!inBounds(x,y))return shp;
  const cel=activeCel(),target=cel[y*W+x];
  for(let i=0;i<W*H;i++)if(colorClose(cel[i],target))shp[i]=1;
  return shp;
}
// Quick selection = a color-aware brush: within the brush footprint (size &
// shape from the brush UI) select the pixels matching the color under the brush.
function quickFlood(x,y,subtract){
  if(!inBounds(x,y))return;
  if(!selection)selection={mask:new Uint8Array(W*H)};
  const cel=activeCel(), target=cel[y*W+x];
  const s=Math.max(1,brushSize),h1=Math.floor((s-1)/2),h2=s-1-h1,ccx=(h2-h1)/2,r=s/2,r2=r*r;
  for(let dy=-h1;dy<=h2;dy++)for(let dx=-h1;dx<=h2;dx++){
    if(brushShape==='circle'&&(dx-ccx)*(dx-ccx)+(dy-ccx)*(dy-ccx)>r2)continue;
    const px=x+dx,py=y+dy;if(!inBounds(px,py))continue;const i=py*W+px;
    if(colorClose(cel[i],target))selection.mask[i]=subtract?0:1;
  }
  let any=false;for(let i=0;i<selection.mask.length;i++)if(selection.mask[i]){any=true;break;}
  if(!any)selection=null;else computeSelBounds();
}
function deselect(){selection=null;lastRange=null;render();}
let antsPhase=0;
function drawSelectionOverlay(){
  // live previews
  if(drawing&&tool==='select'&&startPix&&dragCur){
    const rx=panX+Math.min(startPix.x,dragCur.x)*zoom, ry=panY+Math.min(startPix.y,dragCur.y)*zoom;
    const rw=(Math.abs(dragCur.x-startPix.x)+1)*zoom, rh=(Math.abs(dragCur.y-startPix.y)+1)*zoom;
    ants(rx,ry,rw,rh);
  }
  if(drawing&&tool==='lasso'&&lassoPts&&lassoPts.length>1){
    vctx.save();vctx.lineWidth=1;vctx.strokeStyle='#fff';vctx.setLineDash([4,4]);vctx.lineDashOffset=-antsPhase;
    vctx.beginPath();
    for(let i=0;i<lassoPts.length;i++){const p=lassoPts[i];
      const px=panX+(p.x+.5)*zoom,py=panY+(p.y+.5)*zoom;i?vctx.lineTo(px,py):vctx.moveTo(px,py);}
    vctx.stroke();vctx.restore();
  }
  if(!selection)return;
  const m=selection.mask;
  vctx.save();vctx.lineWidth=1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!m[y*W+x])continue;
    const px=panX+x*zoom,py=panY+y*zoom;
    if(!(y>0&&m[(y-1)*W+x]))antSeg(px,py,px+zoom,py);
    if(!(y<H-1&&m[(y+1)*W+x]))antSeg(px,py+zoom,px+zoom,py+zoom);
    if(!(x>0&&m[y*W+x-1]))antSeg(px,py,px,py+zoom);
    if(!(x<W-1&&m[y*W+x+1]))antSeg(px+zoom,py,px+zoom,py+zoom);
  }
  vctx.restore();
}
function antSeg(x1,y1,x2,y2){
  vctx.beginPath();vctx.moveTo(x1+.5,y1+.5);vctx.lineTo(x2+.5,y2+.5);
  vctx.setLineDash([]);vctx.strokeStyle='#000';vctx.stroke();
  vctx.setLineDash([3,3]);vctx.lineDashOffset=-(antsPhase+((x1+y1)/zoom|0));vctx.strokeStyle='#fff';vctx.stroke();
}
function ants(rx,ry,rw,rh){
  vctx.save();vctx.lineWidth=1;
  vctx.setLineDash([4,4]);vctx.lineDashOffset=-antsPhase;vctx.strokeStyle='#000';vctx.strokeRect(rx+.5,ry+.5,rw-1,rh-1);
  vctx.setLineDash([4,4]);vctx.lineDashOffset=-antsPhase+4;vctx.strokeStyle='#fff';vctx.strokeRect(rx+.5,ry+.5,rw-1,rh-1);
  vctx.restore();
}

/* ================= Tools ================= */
let tool='pencil', lastPaintTool='pencil';
let color=packHex('#e6e8ee',255);
let brushSize=1, opacity=255, pixelPerfect=false, mirrorX=false, brushShape='square';
let previewCel=null;
const SHAPE=['line','rect','ellipse'];
const SELTOOL=['select','lasso','wand','quick','range'];
const QUICKTOL=48; // color tolerance for quick-selection
// Per-tool brush size (pen & eraser keep separate sizes, etc.)
const SIZETOOLS=['pencil','eraser','line','rect','ellipse'];
const brushSizes={pencil:1,eraser:1,line:1,rect:1,ellipse:1};
function setTool(t){
  if(t==='mirror'){mirrorX=!mirrorX;$$('.tool[data-tool="mirror"]').forEach(b=>b.classList.toggle('on',mirrorX));toast(mirrorX?'左右対称 ON':'左右対称 OFF');return;}
  lastRange=null;   // switching tools ends live color-range tolerance
  tool=t;
  $$('.tool').forEach(b=>{if(b.dataset.tool!=='mirror')b.classList.toggle('active',b.dataset.tool===t);});
  $$('.gtool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t)); // left pen/eraser icons
  if(['pencil','eraser','bucket','line','rect','ellipse'].includes(t))lastPaintTool=t;
  if(SIZETOOLS.includes(t)){brushSize=brushSizes[t];updateGauge();} // load this tool's size
  $('#selSec').style.display=SELTOOL.includes(t)?'block':'none';
  updateSelModVisible();
  updateBrushCursor();
}
function inBounds(x,y){return x>=0&&y>=0&&x<W&&y<H;}
function clampX(x){return Math.max(0,Math.min(W-1,x));}
function clampY(y){return Math.max(0,Math.min(H-1,y));}
function withOpacity(px,op){if(op>=255)return px;const a=Math.round(alphaOf(px)*op/255);return ((px&0x00ffffff)|(a<<24))>>>0;}
function setPix(cel,x,y,px){if(!inBounds(x,y)||!inSelection(x,y))return;cel[y*W+x]=px;}
function blendPlot(cel,x,y,px){if(!inBounds(x,y)||!inSelection(x,y))return;cel[y*W+x]=blend(cel[y*W+x],px,alphaOf(px));}
function plot(cel,x,y,px,erase){
  if(erase){setPix(cel,x,y,0);if(mirrorX)setPix(cel,W-1-x,y,0);return;}
  if(opacity>=255){setPix(cel,x,y,px);if(mirrorX)setPix(cel,W-1-x,y,px);}
  else{blendPlot(cel,x,y,px);if(mirrorX)blendPlot(cel,W-1-x,y,px);}
}
function paintPix(cel,x,y,erase){
  const px=erase?0:withOpacity(color,opacity);const s=Math.max(1,brushSize);
  if(s<=1){plot(cel,x,y,px,erase);return;}
  const h1=Math.floor((s-1)/2), h2=s-1-h1;         // centered s×s block
  const cx=(h2-h1)/2, r=s/2, r2=r*r;
  for(let dy=-h1;dy<=h2;dy++)for(let dx=-h1;dx<=h2;dx++){
    if(brushShape==='circle'&&(dx-cx)*(dx-cx)+(dy-cx)*(dy-cx)>r2)continue;
    plot(cel,x+dx,y+dy,px,erase);
  }
}
let ppPrev=[];
function ppPlot(cel,x,y){
  const px=withOpacity(color,opacity);ppPrev.push({x,y});
  if(ppPrev.length===3){
    const a=ppPrev[0],b=ppPrev[1],c=ppPrev[2];
    if((a.x===b.x||a.y===b.y)&&(c.x===b.x||c.y===b.y)&&a.x!==c.x&&a.y!==c.y){
      setPix(cel,b.x,b.y,0);if(mirrorX)setPix(cel,W-1-b.x,b.y,0);ppPrev=[a,c];
    }else ppPrev.shift();
  }
  setPix(cel,x,y,px);if(mirrorX)setPix(cel,W-1-x,y,px);
}
function lineTo(cel,x0,y0,x1,y1,erase){
  let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy;
  while(true){
    if(pixelPerfect&&brushSize<=1&&!erase)ppPlot(cel,x0,y0);else paintPix(cel,x0,y0,erase);
    if(x0===x1&&y0===y1)break;const e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}if(e2<dx){err+=dx;y0+=sy;}
  }
}
function floodFill(cel,x,y){
  if(!inBounds(x,y))return;const target=cel[y*W+x];const repl=withOpacity(color,opacity);
  if(target===repl)return;const stack=[[x,y]];
  while(stack.length){const[cx,cy]=stack.pop();if(!inBounds(cx,cy)||!inSelection(cx,cy))continue;
    if(cel[cy*W+cx]!==target)continue;cel[cy*W+cx]=repl;stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);}
}
function strokeRectShape(cel,x0,y0,x1,y1){
  const xa=Math.min(x0,x1),xb=Math.max(x0,x1),ya=Math.min(y0,y1),yb=Math.max(y0,y1);
  for(let x=xa;x<=xb;x++){paintPix(cel,x,ya,false);paintPix(cel,x,yb,false);}
  for(let y=ya;y<=yb;y++){paintPix(cel,xa,y,false);paintPix(cel,xb,y,false);}
}
function strokeEllipse(cel,x0,y0,x1,y1){
  const xa=Math.min(x0,x1),xb=Math.max(x0,x1),ya=Math.min(y0,y1),yb=Math.max(y0,y1);
  const rx=(xb-xa)/2,ry=(yb-ya)/2,cx=(xa+xb)/2,cy=(ya+yb)/2;
  if(rx<0.5||ry<0.5){paintPix(cel,Math.round(cx),Math.round(cy),false);return;}
  const steps=Math.max(24,Math.ceil((rx+ry)*4));let px=null,py=null;
  for(let i=0;i<=steps;i++){const t=i/steps*Math.PI*2;
    const x=Math.round(cx+rx*Math.cos(t)),y=Math.round(cy+ry*Math.sin(t));
    if(px!==null)lineTo(cel,px,py,x,y,false);px=x;py=y;}
}

/* ================= Pointer handling ================= */
let drawing=false, startPix=null, lastPix=null, dragCur=null;
let panning=false, panStart=null;
let moving=false, moveData=null;
let lassoPts=null;
let pointers=new Map(), pinch=null;
let gesture={maxFingers:0,startT:0,cx:0,cy:0,zoom0:8,moved:0};
const bc=$('#brushcursor');
let spaceHand=false;

function updateBrushCursor(){
  bc.classList.toggle('round',brushShape==='circle');
  if(['pencil','eraser'].includes(tool)){const s=Math.max(1,brushSize)*zoom;bc.style.width=s+'px';bc.style.height=s+'px';}
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function cancelStroke(){
  if(drawing){drawing=false;previewCel=null;lassoPts=null;dragCur=null;
    if(undoStack.length)restore(undoStack.pop());redoStack=lastClearedRedo;updateUndoUI();}
}
function cancelMove(){
  if(moving){moving=false;moveData=null;if(undoStack.length)restore(undoStack.pop());redoStack=lastClearedRedo;updateUndoUI();}
}

stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  const now=performance.now();
  if(pointers.size===0)gesture={maxFingers:0,startT:now,cx:e.clientX,cy:e.clientY,zoom0:zoom,moved:0,zoomed:false};
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  gesture.maxFingers=Math.max(gesture.maxFingers,pointers.size);

  if(pointers.size>=2){
    clearHold();if(picking){picking=false;$('#loupe').classList.remove('show');}
    cancelStroke();cancelMove();panning=false;
    const pts=[...pointers.values()];
    pinch={d:dist(pts[0],pts[1]),cx:(pts[0].x+pts[1].x)/2,cy:(pts[0].y+pts[1].y)/2,zoom,panX,panY,active:false};
    return;
  }

  const{x,y}=screenToPix(e.clientX,e.clientY);
  if(tool==='hand'||spaceHand){panning=true;panStart={x:e.clientX,y:e.clientY,panX,panY};return;}
  if(tool==='dropper'){pickColor(x,y);return;}
  if(tool==='move'){beginMove(x,y);return;}
  if(SELTOOL.includes(tool)){
    if(tool!=='range')lastRange=null;   // a non-range selection ends live tolerance
    pushUndo();curSelMode=selModeFrom(e);drawing=true;startPix={x:clampX(x),y:clampY(y)};dragCur={x:clampX(x),y:clampY(y)};
    if(tool==='wand'){applyShape(wandShape(x,y),curSelMode);drawing=false;render();return;}
    if(tool==='range'){lastRange={x:clampX(x),y:clampY(y),base:selection?selection.mask.slice():null,mode:curSelMode};
      applyShape(rangeShape(x,y),curSelMode);drawing=false;render();return;}
    if(tool==='lasso')lassoPts=[{x:clampX(x),y:clampY(y)}];
    if(tool==='quick'){quickSubtract=(curSelMode==='subtract');
      if(curSelMode==='replace')selection=null;    // new selection grows from here
      qLast={x:clampX(x),y:clampY(y)};quickFlood(qLast.x,qLast.y,quickSubtract);render();return;}
    render();return;
  }
  // paint tools
  if(doc.layers[activeLayer].locked){toast('レイヤーがロックされています');return;}
  pushUndo();drawing=true;startPix=lastPix={x,y};ppPrev=[];
  const cel=activeCel();
  if(tool==='bucket'){floodFill(cel,x,y);drawing=false;render();updateCelThumb(activeLayer,activeFrame);return;}
  // Procreate-style long-press eyedropper (pencil/eraser/shape tools)
  startHoldPick(e.clientX,e.clientY,x,y);
  if(SHAPE.includes(tool)){previewCel=cel.slice();updateShapePreview(x,y);return;}
  const erase=tool==='eraser';
  if(pixelPerfect&&!erase&&brushSize<=1)ppPlot(cel,x,y);else paintPix(cel,x,y,erase);
  render();
});
let holdTimer=null, holdStart=null, picking=false, pickHex=null;
function startHoldPick(cx,cy,px,py){
  clearHold();holdStart={cx,cy,px,py};
  holdTimer=setTimeout(()=>{holdTimer=null;
    if(!drawing)return;
    cancelStroke();               // revert the just-started dot/preview
    beginPick(holdStart.cx,holdStart.cy);
  },450);
}
function clearHold(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}}
// Interactive eyedropper loupe (drag to adjust, release to confirm)
function beginPick(cx,cy){
  picking=true;compositeFrame(activeFrame,cctx); // snapshot visible pixels once
  $('#loupe').classList.add('show');updatePick(cx,cy);
}
function updatePick(cx,cy){
  const{x,y}=screenToPix(cx,cy);
  const cxp=clampX(x), cyp=clampY(y);
  drawLoupe(cxp,cyp);
  // sample color
  const d=cctx.getImageData(cxp,cyp,1,1).data;
  if(d[3]>0){pickHex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
    $('#loupeSw').style.background=pickHex;$('#loupeHex').textContent=pickHex;}
  else{pickHex=null;$('#loupeSw').style.background='transparent';$('#loupeHex').textContent='透明';}
  // position loupe above the finger, clamped
  const L=$('#loupe'),w=132;let lx=cx-w/2, ly=cy-w-40;
  lx=Math.max(6,Math.min(innerWidth-w-6,lx)); if(ly<6)ly=cy+40;
  L.style.left=lx+'px';L.style.top=ly+'px';
}
function drawLoupe(px,py){
  const cv=$('#loupeCv'),ctx=cv.getContext('2d');const N=13,cell=cv.width/N,half=N>>1;
  ctx.imageSmoothingEnabled=false;
  // checker backdrop
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){ctx.fillStyle=((i+j)&1)?'#2b2d34':'#23252b';ctx.fillRect(i*cell,j*cell,cell,cell);}
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const sx=px-half+i, sy=py-half+j;
    if(sx<0||sy<0||sx>=W||sy>=H)continue;
    const d=cctx.getImageData(sx,sy,1,1).data;if(d[3]===0)continue;
    ctx.fillStyle=`rgba(${d[0]},${d[1]},${d[2]},${d[3]/255})`;ctx.fillRect(i*cell,j*cell,cell,cell);
  }
  // center target cell
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(half*cell+1,half*cell+1,cell-2,cell-2);
  ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(half*cell+0.5,half*cell+0.5,cell-1,cell-1);
}
function commitPick(){
  picking=false;$('#loupe').classList.remove('show');
  if(pickHex){setColorHex(pickHex);toast(pickHex);}
  setTool(lastPaintTool);pickHex=null;
}

stage.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(picking){updatePick(e.clientX,e.clientY);return;}
  if(['pencil','eraser','quick'].includes(tool)&&e.pointerType!=='touch'){
    bc.style.display='block';bc.classList.toggle('round',brushShape==='circle');
    const bs=Math.max(1,brushSize),s=bs*zoom;const{x,y}=screenToPix(e.clientX,e.clientY);
    const off=Math.floor((bs-1)/2)*zoom;
    bc.style.left=(panX+x*zoom-off)+'px';bc.style.top=(panY+y*zoom-off)+'px';bc.style.width=s+'px';bc.style.height=s+'px';
  } else if(e.pointerType!=='touch') bc.style.display='none';
  if(pinch&&pointers.size>=2){
    const pts=[...pointers.values()];const d=dist(pts[0],pts[1]);
    const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
    const cenMove=Math.hypot(cx-pinch.cx,cy-pinch.cy);   // vs initial centroid
    gesture.moved=Math.max(gesture.moved,cenMove);
    // Deadzone: don't start zoom/pan until fingers clearly spread or slide,
    // so a quick 2-finger tap (=undo) isn't mistaken for a zoom.
    if(!pinch.active){
      if(Math.abs(d/pinch.d-1)<0.14 && cenMove<16)return;   // still a tap candidate
      pinch.active=true;gesture.zoomed=true;
      // re-anchor so motion starts smoothly from here
      pinch.d=d;pinch.cx=cx;pinch.cy=cy;pinch.zoom=zoom;pinch.panX=panX;pinch.panY=panY;
    }
    let nz=Math.max(1,Math.min(64,pinch.zoom*(d/pinch.d)));
    const rect=stage.getBoundingClientRect();
    const ox=(pinch.cx-rect.left-pinch.panX)/pinch.zoom, oy=(pinch.cy-rect.top-pinch.panY)/pinch.zoom;
    zoom=nz;panX=(cx-rect.left)-ox*zoom;panY=(cy-rect.top)-oy*zoom;renderView();return;
  }
  if(panning){panX=panStart.panX+(e.clientX-panStart.x);panY=panStart.panY+(e.clientY-panStart.y);renderView();return;}
  if(moving){doMove(e);return;}
  if(!drawing)return;
  if(holdTimer&&holdStart&&Math.hypot(e.clientX-holdStart.cx,e.clientY-holdStart.cy)>6)clearHold(); // moved => it's a stroke
  const{x,y}=screenToPix(e.clientX,e.clientY);
  if(tool==='select'){dragCur={x:clampX(x),y:clampY(y)};render();return;}
  if(tool==='lasso'){const p={x:clampX(x),y:clampY(y)};const last=lassoPts[lassoPts.length-1];
    if(!last||last.x!==p.x||last.y!==p.y)lassoPts.push(p);render();return;}
  if(tool==='quick'){const cx=clampX(x),cy=clampY(y);
    if(!qLast||qLast.x!==cx||qLast.y!==cy){qLast={x:cx,y:cy};quickFlood(cx,cy,quickSubtract);render();}return;}
  if(SHAPE.includes(tool)){updateShapePreview(x,y);return;}
  const cel=activeCel();const erase=tool==='eraser';
  lineTo(cel,lastPix.x,lastPix.y,x,y,erase);lastPix={x,y};render();updateCelThumbThrottled();
});

function endPointer(e){
  try{stage.releasePointerCapture(e.pointerId);}catch(_){}
  clearHold();
  const wasN=pointers.size;pointers.delete(e.pointerId);
  if(pointers.size<2)pinch=null;
  if(picking&&pointers.size===0){commitPick();return;}
  if(pointers.size===0){
    // gesture: multi-finger tap => undo/redo (favored over a tiny pinch:
    // only rejected once the pinch deadzone actually engaged a zoom/pan)
    const dt=performance.now()-gesture.startT;
    if(dt<360&&!gesture.zoomed&&gesture.moved<22&&gesture.maxFingers>=2){
      if(gesture.maxFingers===2){undo();}
      else if(gesture.maxFingers>=3){redo();}
      finishAll();return;
    }
    finishAll();
  }
}
function finishAll(){
  if(panning)panning=false;
  if(moving)endMove(false);
  if(drawing){
    drawing=false;
    if(tool==='select'){
      if(dragCur&&startPix){
        if(curSelMode==='replace'&&startPix.x===dragCur.x&&startPix.y===dragCur.y)selection=null;
        else applyShape(rectShape(startPix.x,startPix.y,dragCur.x,dragCur.y),curSelMode);
      }
    }else if(tool==='lasso'){
      applyShape(lassoShape(lassoPts),curSelMode);lassoPts=null;
    }else if(tool==='quick'){qLast=null;computeSelBounds();
    }else if(SHAPE.includes(tool)&&previewCel){activeCel().set(previewCel);previewCel=null;}
    dragCur=null;render();updateCelThumb(activeLayer,activeFrame);
  }
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',endPointer);
stage.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')bc.style.display='none';});

function updateShapePreview(x,y){
  const ov=activeCel().slice();
  if(tool==='line')lineTo(ov,startPix.x,startPix.y,x,y,false);
  else if(tool==='rect')strokeRectShape(ov,startPix.x,startPix.y,x,y);
  else if(tool==='ellipse')strokeEllipse(ov,startPix.x,startPix.y,x,y);
  previewCel=ov;renderView();
}

/* Move tool with mask */
function beginMove(x,y){
  pushUndo();moving=true;
  const cel=activeCel();const base=cel.slice();const mask=selection?selection.mask:null;
  const buf=new Uint32Array(W*H);
  for(let i=0;i<W*H;i++)if(!mask||mask[i]){buf[i]=cel[i];}
  moveData={base,buf,mask,ox:x,oy:y,dx:0,dy:0};
}
function doMove(e){
  const{x,y}=screenToPix(e.clientX,e.clientY);moveData.dx=x-moveData.ox;moveData.dy=y-moveData.oy;
  const cel=activeCel();cel.set(moveData.base);const{buf,mask,dx,dy}=moveData;
  for(let i=0;i<W*H;i++)if(!mask||mask[i])cel[i]=0;
  for(let i=0;i<W*H;i++){
    if(mask&&!mask[i])continue;if(!mask&&buf[i]===0)continue;
    const sx=i%W,sy=(i/W)|0,nx=sx+dx,ny=sy+dy;
    if(inBounds(nx,ny)&&buf[i]!==0)cel[ny*W+nx]=buf[i];
  }
  render();
}
function endMove(cancel){
  moving=false;
  if(cancel){if(undoStack.length)restore(undoStack.pop());updateUndoUI();moveData=null;render();return;}
  if(selection&&moveData){
    if(fillOnMove&&moveData.mask&&(moveData.dx||moveData.dy))
      edgeExtendFill(activeCel(),moveData.base,moveData.mask,moveData.dx,moveData.dy);
    const nm=selBuf();const{dx,dy}=moveData;
    for(let i=0;i<W*H;i++)if(selection.mask[i]){const sx=i%W,sy=(i/W)|0,nx=sx+dx,ny=sy+dy;if(inBounds(nx,ny))nm[ny*W+nx]=1;}
    selection.mask=nm;computeSelBounds();
  }
  moveData=null;render();updateCelThumb(activeLayer,activeFrame);
}

/* ================= Color / palette ================= */
let palette=[];
const DEFAULT_PAL=['#00000000','#1a1c2c','#5d275d','#b13e53','#ef7d57','#ffcd75','#a7f070','#38b764',
'#257179','#29366f','#3b5dc9','#41a6f6','#73eff7','#f4f4f4','#94b0c2','#566c86','#333c57','#ffffff',
'#e6e8ee','#9aa0ad','#5b8cff','#41c98a','#e0596b','#ff004d'];

/* ---- Color wheel (hue+sat disc, brightness slider) ---- */
function hsv2rgb(h,s,v){h/=360;const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  let r,g,b;switch(i%6){case 0:r=v,g=t,b=p;break;case 1:r=q,g=v,b=p;break;case 2:r=p,g=v,b=t;break;
  case 3:r=p,g=q,b=v;break;case 4:r=t,g=p,b=v;break;default:r=v,g=p,b=q;}
  return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  return [h,mx?d/mx:0,mx];}
let wheelV=0.9, wheelH=0, wheelS=0, wheelCanvas, wheelCtx, wheelDrawnV=-1;
function drawWheel(){
  if(!wheelCanvas){wheelCanvas=$('#colorWheel');wheelCtx=wheelCanvas.getContext('2d');}
  if(wheelDrawnV===wheelV)return; wheelDrawnV=wheelV;
  const n=wheelCanvas.width,R=n/2,ctx=wheelCtx,img=ctx.createImageData(n,n),d=img.data;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const dx=x-R,dy=y-R,r=Math.sqrt(dx*dx+dy*dy),i=(y*n+x)*4;
    if(r>R){d[i+3]=0;continue;}
    let h=Math.atan2(dy,dx)*180/Math.PI;if(h<0)h+=360;
    const rgb=hsv2rgb(h,Math.min(1,r/R),wheelV);
    d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
}
function updateWheelCursor(){
  const cv=$('#colorWheel');if(!cv)return;
  const size=cv.clientWidth||180, R=size/2, ang=wheelH*Math.PI/180, rad=wheelS*R;
  const cur=$('#wheelCursor');
  cur.style.left=(cv.offsetLeft+R+Math.cos(ang)*rad)+'px';
  cur.style.top=(cv.offsetTop+R+Math.sin(ang)*rad)+'px';
}
function wheelToColor(){const [r,g,b]=hsv2rgb(wheelH,wheelS,wheelV);
  const hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  color=packHex(hex,255);$('#curColor').style.background=hex;$('#colorPick').value=hex;updateWheelCursor();}
function syncWheel(hex){ // reflect an external color into wheel H/S/V + slider
  const n=parseInt(hex.slice(1),16),[h,s,v]=rgb2hsv((n>>16)&255,(n>>8)&255,n&255);
  wheelH=h;wheelS=s;wheelV=v;const vs=$('#valSlider');if(vs)vs.value=Math.round(v*100);
  drawWheel();updateWheelCursor();}
function wheelPick(cx,cy){const cv=$('#colorWheel'),r=cv.getBoundingClientRect(),R=r.width/2;
  let dx=cx-r.left-R,dy=cy-r.top-R,dist=Math.sqrt(dx*dx+dy*dy);
  let h=Math.atan2(dy,dx)*180/Math.PI;if(h<0)h+=360;
  wheelH=h;wheelS=Math.min(1,dist/R);wheelToColor();}
function initWheel(){
  const cv=$('#colorWheel');drawWheel();updateWheelCursor();
  let dragging=false;
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}dragging=true;wheelPick(e.clientX,e.clientY);});
  cv.addEventListener('pointermove',e=>{if(dragging)wheelPick(e.clientX,e.clientY);});
  cv.addEventListener('pointerup',()=>{dragging=false;});
  cv.addEventListener('pointercancel',()=>{dragging=false;});
  $('#valSlider').oninput=e=>{wheelV=(+e.target.value)/100;drawWheel();wheelToColor();};
}
function pickColor(x,y){
  if(!inBounds(x,y))return;compositeFrame(activeFrame,cctx);
  const d=cctx.getImageData(x,y,1,1).data;if(d[3]===0){toast('透明');return;}
  const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  setColorHex(hex);toast(hex);setTool(lastPaintTool);
}

/* ================= Timeline (Aseprite-style grid) ================= */
function attachLong(el,fn){let t;
  el.addEventListener('pointerdown',()=>{t=setTimeout(fn,550);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(t)));}
function drawCelThumb(ctx,layerId,fi){
  ctx.clearRect(0,0,W,H);const cel=doc.cels.get(celKey(layerId,fi));if(!cel)return;
  ctx.putImageData(new ImageData(new Uint8ClampedArray(cel.slice().buffer),W,H),0,0);
}
function refreshTimeline(){
  const grid=$('#tlGrid');grid.innerHTML='';
  const hrow=document.createElement('div');hrow.className='tl-row tl-head';
  const corner=document.createElement('div');corner.className='tl-corner';
  const mkc=(txt,title,fn)=>{const b=document.createElement('button');b.className='corner-btn';b.textContent=txt;b.title=title;b.onclick=fn;return b;};
  corner.appendChild(mkc('＋','レイヤー追加',addLayer));
  corner.appendChild(mkc('⧉','レイヤー複製',dupLayerFn));
  corner.appendChild(mkc('⬇','下と結合',mergeLayerFn));
  hrow.appendChild(corner);
  doc.frames.forEach((f,fi)=>{
    const c=document.createElement('div');c.className='tl-fnum'+(fi===activeFrame?' active':'');c.textContent=fi+1;
    c.dataset.fi=fi;
    c.onclick=()=>{if(justDragged)return;activeFrame=fi;refreshTimeline();render();};
    c.addEventListener('pointerdown',e=>beginReorder('frame',c,e));
    hrow.appendChild(c);
  });
  grid.appendChild(hrow);
  for(let li=doc.layers.length-1;li>=0;li--){
    const L=doc.layers[li];const row=document.createElement('div');row.className='tl-row';
    const head=document.createElement('div');head.className='tl-lhead'+(li===activeLayer?' active':'');head.dataset.li=li;
    head.innerHTML=`<span class="grip" title="ドラッグで並べ替え">⠿</span><span class="eye">${L.visible?'👁':'🚫'}</span><span class="lock">${L.locked?'🔒':'🔓'}</span><span class="lname">${L.name}</span>`;
    head.querySelector('.grip').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();beginReorder('layer',head,e);});
    head.querySelector('.eye').onclick=e=>{e.stopPropagation();L.visible=!L.visible;refreshTimeline();render();};
    head.querySelector('.lock').onclick=e=>{e.stopPropagation();L.locked=!L.locked;refreshTimeline();};
    const ln=head.querySelector('.lname');
    head.onclick=()=>{if(justDragged)return;activeLayer=li;refreshTimeline();syncLayerPanel();};
    ln.ondblclick=e=>{e.stopPropagation();ln.contentEditable=true;ln.focus();
      const r=document.createRange();r.selectNodeContents(ln);const s=getSelection();s.removeAllRanges();s.addRange(r);};
    ln.onblur=()=>{ln.contentEditable=false;L.name=ln.textContent.trim()||L.name;refreshTimeline();};
    ln.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();ln.blur();}};
    row.appendChild(head);
    doc.frames.forEach((f,fi)=>{
      const cell=document.createElement('div');
      cell.className='tl-cell'+(li===activeLayer&&fi===activeFrame?' active':'');
      cell.dataset.l=li;cell.dataset.f=fi;
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;cell.appendChild(cv);
      drawCelThumb(cv.getContext('2d'),L.id,fi);
      cell.onclick=()=>{activeLayer=li;activeFrame=fi;refreshTimeline();render();syncLayerPanel();};
      attachLong(cell,()=>{activeLayer=li;activeFrame=fi;if(confirm('このセルを消去しますか？')){pushUndo();activeCel().fill(0);refreshTimeline();render();}});
      row.appendChild(cell);
    });
    grid.appendChild(row);
  }
  syncLayerPanel();
}

/* ---- Drag & drop reorder for layers (vertical) and frames (horizontal) ---- */
let drag=null, justDragged=false;
function beginReorder(kind,el,e){
  const sx=e.clientX, sy=e.clientY; let started=false;
  const cap=e.currentTarget||e.target;   // keep receiving moves on touch
  try{cap.setPointerCapture(e.pointerId);}catch(_){}
  const move=ev=>{
    if(!started){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;started=true;startDrag(kind,el);}
    dragMove(ev);
  };
  const end=ev=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',end);
    document.removeEventListener('pointercancel',end);
    if(started){finishDrag(ev);justDragged=true;setTimeout(()=>{justDragged=false;},60);}
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
}
function startDrag(kind,el){
  const items=kind==='layer'?$$('#tlGrid .tl-lhead'):$$('#tlGrid .tl-fnum');
  drag={kind,row:el,items,slot:null};
  el.classList.add('drag');
  const g=document.createElement('div');g.className='tl-ghost';
  g.textContent=kind==='layer'?el.querySelector('.lname').textContent:('フレーム '+(+el.dataset.fi+1));
  document.body.appendChild(g);drag.ghost=g;
  const ind=document.createElement('div');ind.className='tl-drop';document.body.appendChild(ind);drag.ind=ind;
}
function dragMove(e){
  if(!drag)return;
  drag.ghost.style.left=(e.clientX+12)+'px';drag.ghost.style.top=(e.clientY+12)+'px';
  const items=drag.items, vertical=drag.kind==='layer';
  let slot=items.length;
  for(let i=0;i<items.length;i++){
    const r=items[i].getBoundingClientRect();
    const mid=vertical?r.top+r.height/2:r.left+r.width/2;
    const pos=vertical?e.clientY:e.clientX;
    if(pos<mid){slot=i;break;}
  }
  drag.slot=slot;
  const ind=drag.ind, first=items[0].getBoundingClientRect();
  if(vertical){
    const y=slot<items.length?items[slot].getBoundingClientRect().top:items[items.length-1].getBoundingClientRect().bottom;
    ind.style.left=first.left+'px';ind.style.width=first.width+'px';ind.style.height='3px';ind.style.top=(y-1)+'px';
  }else{
    const x=slot<items.length?items[slot].getBoundingClientRect().left:items[items.length-1].getBoundingClientRect().right;
    const gr=$('#tlGrid').getBoundingClientRect();
    ind.style.top=first.top+'px';ind.style.height=Math.max(46,gr.height)+'px';ind.style.width='3px';ind.style.left=(x-1)+'px';
  }
}
function finishDrag(e){
  dragMove(e);
  const {kind,row,items,ghost,ind}=drag;
  row.classList.remove('drag');ghost.remove();ind.remove();
  const fromD=items.indexOf(row);let toD=drag.slot==null?fromD:drag.slot;
  if(toD>fromD)toD--;
  drag=null;
  if(toD===fromD||toD<0)return;
  if(kind==='layer')reorderLayerDisplay(fromD,toD);else moveFrame(fromD,toD);
}
// display order (top->bottom) == doc.layers reversed
function reorderLayerDisplay(fromD,toD){
  pushUndo();
  const disp=doc.layers.slice().reverse();
  const [m]=disp.splice(fromD,1);disp.splice(toD,0,m);
  doc.layers=disp.reverse();activeLayer=doc.layers.indexOf(m);
  refreshTimeline();render();toast('レイヤーを移動');
}
function moveFrame(from,to){
  pushUndo();
  const order=doc.frames.map((_,i)=>i);
  const [m]=order.splice(from,1);order.splice(to,0,m);
  const newCels=new Map();
  doc.layers.forEach(L=>order.forEach((oldIdx,ni)=>{const c=doc.cels.get(L.id+':'+oldIdx);if(c)newCels.set(L.id+':'+ni,c);}));
  doc.cels=newCels;doc.frames=order.map(oi=>doc.frames[oi]);
  activeFrame=to;refreshTimeline();render();toast('フレームを移動');
}

function updateCelThumb(li,fi){
  const cell=$(`#tlGrid .tl-cell[data-l="${li}"][data-f="${fi}"]`);
  if(cell){const cv=cell.querySelector('canvas');if(cv)drawCelThumb(cv.getContext('2d'),doc.layers[li].id,fi);}
}
let thumbT;
function updateCelThumbThrottled(){if(thumbT)return;thumbT=setTimeout(()=>{thumbT=null;updateCelThumb(activeLayer,activeFrame);},120);}
function highlightTimeline(){
  $$('#tlGrid .tl-fnum').forEach((el,i)=>el.classList.toggle('active',i===activeFrame));
  $$('#tlGrid .tl-cell').forEach(el=>el.classList.toggle('active',+el.dataset.l===activeLayer&&+el.dataset.f===activeFrame));
}
function syncLayerPanel(){
  const L=doc.layers[activeLayer];if(!L)return;
  $('#layerOpacity').value=L.opacity;$('#layerOpacityV').textContent=Math.round(L.opacity/255*100)+'%';

/* Layer ops */
function addLayer(){pushUndo();doc.layers.splice(activeLayer+1,0,{id:uid(),name:'レイヤー '+(doc.layers.length+1),visible:true,opacity:255,locked:false});activeLayer++;refreshTimeline();render();}
function dupLayerFn(){pushUndo();const src=doc.layers[activeLayer];
  const nl={id:uid(),name:src.name+' コピー',visible:true,opacity:src.opacity,locked:false};
  doc.layers.splice(activeLayer+1,0,nl);
  doc.frames.forEach((f,fi)=>{const c=doc.cels.get(celKey(src.id,fi));if(c)doc.cels.set(celKey(nl.id,fi),c.slice());});
  activeLayer++;refreshTimeline();render();}
function delLayerFn(){if(doc.layers.length<=1){toast('最後のレイヤーは削除できません');return;}
  pushUndo();const L=doc.layers[activeLayer];doc.frames.forEach((f,fi)=>doc.cels.delete(celKey(L.id,fi)));
  doc.layers.splice(activeLayer,1);activeLayer=Math.max(0,activeLayer-1);refreshTimeline();render();}
function mergeLayerFn(){if(activeLayer===0){toast('下にレイヤーがありません');return;}
  pushUndo();const top=doc.layers[activeLayer],bot=doc.layers[activeLayer-1];
  doc.frames.forEach((f,fi)=>{const tc=doc.cels.get(celKey(top.id,fi));if(!tc)return;
    let bcel=doc.cels.get(celKey(bot.id,fi));if(!bcel){bcel=newCel();doc.cels.set(celKey(bot.id,fi),bcel);}
    for(let i=0;i<tc.length;i++){const s=tc[i];const sa=Math.round(((s>>>24)&255)*top.opacity/255);if(sa)bcel[i]=blend(bcel[i],s,sa);}
    doc.cels.delete(celKey(top.id,fi));});
  doc.layers.splice(activeLayer,1);activeLayer--;refreshTimeline();render();}
$('#layerDel').onclick=delLayerFn;
$('#layerOpacity').oninput=e=>{doc.layers[activeLayer].opacity=+e.target.value;$('#layerOpacityV').textContent=Math.round(e.target.value/255*100)+'%';render();};

/* Frame ops */
function reindexAfterDelete(delIdx){const nm=new Map();
  doc.cels.forEach((v,k)=>{const[lid,f]=k.split(':').map(Number);
    if(f<delIdx)nm.set(k,v);else if(f>delIdx)nm.set(lid+':'+(f-1),v);});doc.cels=nm;}
function duplicateFrame(fi){pushUndo();const src=doc.frames[fi];const nm=new Map();
  doc.cels.forEach((v,k)=>{const[lid,f]=k.split(':').map(Number);if(f<=fi)nm.set(k,v);else nm.set(lid+':'+(f+1),v);});
  doc.layers.forEach(L=>{const c=nm.get(celKey(L.id,fi));if(c)nm.set(celKey(L.id,fi+1),c.slice());});
  doc.cels=nm;doc.frames.splice(fi+1,0,{id:uid(),duration:src.duration});activeFrame=fi+1;refreshTimeline();render();}
function deleteFrame(fi){if(doc.frames.length<=1){toast('最後のフレームは削除不可');return;}
  pushUndo();doc.layers.forEach(L=>doc.cels.delete(celKey(L.id,fi)));reindexAfterDelete(fi);
  doc.frames.splice(fi,1);activeFrame=Math.max(0,fi-1);refreshTimeline();render();}
function frameMenu(fi){activeFrame=fi;refreshTimeline();
  if(confirm('フレーム '+(fi+1)+' を削除しますか？（キャンセルで複製）'))deleteFrame(fi);else duplicateFrame(fi);}
$('#frameAdd').onclick=()=>{pushUndo();doc.frames.push({id:uid(),duration:Math.round(1000/(+$('#fps').value||8))});activeFrame=doc.frames.length-1;refreshTimeline();render();};
$('#frameDup').onclick=()=>duplicateFrame(activeFrame);
$('#frameDel').onclick=()=>deleteFrame(activeFrame);

const gtrack=$('#gtrack'),gfill=$('#gfill'),gdot=$('#gdot'),gval=$('#gval');

function setBrushFromY(clientY){

// Big +/- buttons act as Ctrl/Alt: hold to modify momentarily, tap to lock.
let selHoldTime=0;
function bindSelMod(btn,mode){
  btn.addEventListener('pointerdown',e=>{e.preventDefault();try{btn.setPointerCapture(e.pointerId);}catch(_){}
    selHold=mode;selHoldTime=performance.now();updateSelBtns();});
  const up=e=>{try{btn.releasePointerCapture(e.pointerId);}catch(_){}
    const dt=performance.now()-selHoldTime;selHold=null;
    if(dt<250)stickySel=(stickySel===mode?'replace':mode);  // quick tap = toggle lock
    updateSelBtns();};
  btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);
}
bindSelMod($('#selPlus'),'add');bindSelMod($('#selMinus'),'subtract');
function updateSelBtns(){
  const add=selHold==='add'||stickySel==='add', sub=selHold==='subtract'||stickySel==='subtract';
  $('#selPlus').classList.toggle('on',add);$('#selMinus').classList.toggle('on',sub);
}
function updateSelModVisible(){
  $('#selMod').classList.toggle('show',SELTOOL.includes(tool)||!!selection);
  $('#nudge').classList.toggle('show',!!selection);
  $('#selDel').classList.toggle('show',!!selection);
  if(typeof positionSelControls==='function')positionSelControls();
}
// Delete (clear) the selected pixels on the active layer (undoable).
function deleteSelection(){
  if(!selection)return;
  if(doc.layers[activeLayer].locked){toast('レイヤーがロックされています');return;}
  pushUndo();const cel=activeCel();
  for(let i=0;i<W*H;i++)if(selection.mask[i])cel[i]=0;
  render();updateCelThumb(activeLayer,activeFrame);toast('選択範囲を削除');
}
$('#selDel').onclick=deleteSelection;
// Nudge the selected content (and marquee) by 1px. A hold coalesces into
// one undo step (firstPush only on press).
function nudgeStep(dx,dy,firstPush){
  if(!selection)return;
  if(doc.layers[activeLayer].locked){toast('レイヤーがロックされています');stopNudge();return;}
  if(firstPush)pushUndo();
  const cel=activeCel(),mask=selection.mask,origCel=cel.slice();
  for(let i=0;i<W*H;i++)if(mask[i])cel[i]=0;
  for(let i=0;i<W*H;i++){if(!mask[i])continue;const sx=i%W,sy=(i/W)|0,nx=sx+dx,ny=sy+dy;if(inBounds(nx,ny))cel[ny*W+nx]=origCel[i];}
  if(fillOnMove)edgeExtendFill(cel,origCel,mask,dx,dy);
  const nm=selBuf();
  for(let i=0;i<W*H;i++)if(mask[i]){const sx=i%W,sy=(i/W)|0,nx=sx+dx,ny=sy+dy;if(inBounds(nx,ny))nm[ny*W+nx]=1;}
  selection.mask=nm;computeSelBounds();render();updateCelThumb(activeLayer,activeFrame);
}
// Fill the vacated gap by stretching the trailing edge of the moved content:
// each gap pixel (was opaque, now empty) copies the nearest moved-content
// pixel found by marching in the move direction.
let fillOnMove=false;
function edgeExtendFill(cel,origCel,mask,dx,dy){
  const sx=Math.sign(dx), sy=Math.sign(dy); if(!sx&&!sy)return;
  const maxS=Math.max(W,H);
  for(let i=0;i<W*H;i++){
    if(!mask[i]||!origCel[i]||cel[i])continue; // only gaps that used to have content
    let x=i%W, y=(i/W)|0, c=0;
    for(let s=0;s<maxS;s++){x+=sx;y+=sy;if(x<0||y<0||x>=W||y>=H)break;const v=cel[y*W+x];if(v){c=v;break;}}
    if(c)cel[i]=c;
  }
}
let nudgeTimer=null;

/* ================= Docking panel layout (drag → dock preview → snap) ================= */
const workspace=$('#workspace');
const PANELS={gauge:'#pnlGauge',tools:'#pnlTools',side:'#pnlSide',tl:'#pnlTl'};
const PW={gauge:52,tools:56,side:214,tl:260};   // docked column widths
const LAYOUT_KEY='pxeditor-dock-v2';
const EDGE=90;                                   // how close to an edge to dock
let dockState=defaultDock();
function defaultDock(){return {gauge:{dock:'left',ord:0},tools:{dock:'left',ord:100},
  side:{dock:'right',ord:0},tl:{dock:'bottom',ord:0,h:190}};}
function panelKey(el){for(const k in PANELS)if($(PANELS[k])===el)return k;return null;}
function measureH(el){const p=el.style.height;el.style.height='';const h=el.offsetHeight;el.style.height=p;return h;}

function setPrz(el,side){let p=el.querySelector('.prz');if(!p)return;
  if(side){p.style.display='block';p.className='prz '+side;}else p.style.display='none';}
function pw(k){return dockState[k].w||PW[k]||200;}
function relayout(){
  const W=workspace.clientWidth,H=workspace.clientHeight,G=2;   // tight seams
  dockState.tl.dock='bottom';   // timeline is pinned to the bottom edge
  const sides={left:[],right:[],top:[],bottom:[],float:[]};
  for(const k in PANELS){const s=dockState[k].dock;(sides[s]||sides.float).push(k);}
  for(const s in sides)sides[s].sort((a,b)=>(dockState[a].ord||0)-(dockState[b].ord||0));
  const bandTot=(list)=>{let sum=0;list.forEach((k,i)=>{sum+=(k==='tl'?(dockState.tl.h||190):Math.min(measureH($(PANELS[k])),H*0.5))+(i?G:0);});return sum;};
  const topH=sides.top.length?bandTot(sides.top)+G:0, botH=sides.bottom.length?bandTot(sides.bottom):0;
  const colTop=topH, colBot=H-botH, colH=Math.max(120,colBot-colTop);
  let lx=0; sides.left.forEach(k=>{const el=$(PANELS[k]),w=pw(k),h=dockState[k].h?Math.min(dockState[k].h,colH):colH;
    el.style.width=w+'px';el.style.left=lx+'px';el.style.top=colTop+'px';el.style.height=h+'px';setPrz(el,'br');lx+=w+G;});
  let rx=W; sides.right.forEach(k=>{const el=$(PANELS[k]),w=pw(k),h=dockState[k].h?Math.min(dockState[k].h,colH):colH;
    el.style.width=w+'px';el.style.left=(rx-w)+'px';el.style.top=colTop+'px';el.style.height=h+'px';setPrz(el,'bl');rx-=w+G;});
  let ty=0; sides.top.forEach(k=>{const el=$(PANELS[k]),h=(k==='tl'?(dockState.tl.h||190):Math.min(measureH(el),H*0.5));
    el.style.left='0px';el.style.width=W+'px';el.style.top=ty+'px';el.style.height=h+'px';setPrz(el,null);ty+=h+G;});
  // bottom: flush to the very bottom edge, full width (no gap under the timeline)
  let by=H; sides.bottom.forEach(k=>{const el=$(PANELS[k]),h=(k==='tl'?(dockState.tl.h||190):Math.min(measureH(el),H*0.5));
    el.style.left='0px';el.style.width=W+'px';el.style.top=(by-h)+'px';el.style.height=h+'px';setPrz(el,null);by-=h;});
  sides.float.forEach(k=>{const el=$(PANELS[k]),c=dockState[k];
    el.style.left=(c.x||40)+'px';el.style.top=(c.y||40)+'px';
    el.style.width=(c.w||PW[k]||200)+'px';el.style.height=(c.h||300)+'px';setPrz(el,'br');});
  positionSelControls();
}
// Keep the selection tool controls clear of the left docks and above the timeline.
function positionSelControls(){
  const W=workspace.clientWidth,H=workspace.clientHeight;
  let leftEdge=8;
  for(const k in PANELS){if(dockState[k].dock==='left'){const el=$(PANELS[k]);
    const rr=(parseFloat(el.style.left)||0)+(parseFloat(el.style.width)||PW[k]||0);if(rr>leftEdge)leftEdge=rr;}}
  const x=leftEdge+12;
  const tl=$('#pnlTl'),tlTop=tl?(parseFloat(tl.style.top)||H):H;
  const bottomGap=H-tlTop;
  const sm=$('#selMod'),sd=$('#selDel'),nu=$('#nudge');
  if(sm){sm.style.left=x+'px';sm.style.top=Math.max(70,(colTopVal()+tlTop)/2)+'px';}
  if(sd){sd.style.left=x+'px';sd.style.top='12px';}
  if(nu){nu.style.left=x+'px';nu.style.bottom=(bottomGap+12)+'px';}
}
function colTopVal(){const M=8;let topH=0;for(const k in PANELS)if(dockState[k].dock==='top'){topH+= (k==='tl'?(dockState.tl.h||190):Math.min(measureH($(PANELS[k])),innerHeight*0.5))+8;}return M+(topH?topH+M:0);}
function dropZoneFor(px,py,key){const W=workspace.clientWidth,H=workspace.clientHeight;
  const dl=px,dr=W-px,dt=py,db=H-py;
  let cand=[['left',dl],['right',dr],['top',dt]];
  if(key==='tl')cand=[['bottom',db]]; else cand.push(['bottom',db]);
  cand.sort((a,b)=>a[1]-b[1]);
  if(cand[0][1]>EDGE)return 'float';
  let z=cand[0][0];
  if(key!=='tl'&&z==='bottom'){ // bottom is reserved for the timeline
    const alt=cand.filter(c=>c[0]!=='bottom').sort((a,b)=>a[1]-b[1])[0];
    z=alt&&alt[1]<EDGE?alt[0]:'float';
  }
  return z;}
function showPrev(zone,key){const el=$('#dockPrev'),W=workspace.clientWidth,H=workspace.clientHeight;
  if(zone==='float'){el.classList.remove('show');return;}
  const pw=PW[key]||200, ph=(key==='tl'?(dockState.tl.h||190):170);let x,y,w,h;
  if(zone==='left'){x=6;y=6;w=pw+8;h=H-12;}
  else if(zone==='right'){w=pw+8;x=W-w-6;y=6;h=H-12;}
  else if(zone==='top'){x=6;y=6;w=W-12;h=ph;}
  else{h=ph;x=6;w=W-12;y=H-h-6;}
  el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px';el.classList.add('show');}
function hidePrev(){$('#dockPrev').classList.remove('show');}

function saveLayout(){try{localStorage.setItem(LAYOUT_KEY,JSON.stringify(dockState));}catch(_){}}
function loadLayout(){try{const s=localStorage.getItem(LAYOUT_KEY);if(s)return JSON.parse(s);}catch(_){}return null;}
function resetLayout(){dockState=defaultDock();relayout();saveLayout();render();toast('レイアウトをリセット');}

function startPanelDrag(panel,handle,e){
  const key=panelKey(panel);if(!key)return;
  e.preventDefault();try{handle.setPointerCapture(e.pointerId);}catch(_){}
  panel.classList.add('dragging');panel.style.zIndex=50;
  const wr=workspace.getBoundingClientRect(),r=panel.getBoundingClientRect();
  const offX=e.clientX-r.left, offY=e.clientY-r.top;let zone='float';
  const move=ev=>{
    panel.style.left=(ev.clientX-wr.left-offX)+'px';panel.style.top=(ev.clientY-wr.top-offY)+'px';
    zone=dropZoneFor(ev.clientX-wr.left,ev.clientY-wr.top,key);showPrev(zone,key);
  };
  const up=ev=>{try{handle.releasePointerCapture(ev.pointerId);}catch(_){}
    panel.classList.remove('dragging');panel.style.zIndex='';hidePrev();
    document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
    if(zone==='float'){const c=dockState[key];c.dock='float';
      c.x=Math.max(0,parseFloat(panel.style.left)||40);c.y=Math.max(0,parseFloat(panel.style.top)||40);
      c.w=panel.offsetWidth;c.h=Math.min(panel.offsetHeight,workspace.clientHeight*0.7);}
    else{const c=dockState[key];c.dock=zone;
      c.ord=(zone==='left'||zone==='right')?(parseFloat(panel.style.left)||0):(parseFloat(panel.style.top)||0);}

}
function startPanelResize(panel,handle,e){
  const key=panelKey(panel);if(!key)return;
  e.preventDefault();e.stopPropagation();try{handle.setPointerCapture(e.pointerId);}catch(_){}
  const r=panel.getBoundingClientRect(),bl=handle.classList.contains('bl');
  const move=ev=>{
    let w=bl?(r.right-ev.clientX):(ev.clientX-r.left);
    let h=ev.clientY-r.top;
    w=Math.max(44,Math.min(workspace.clientWidth-20,w));
    h=Math.max(80,Math.min(workspace.clientHeight-20,h));
    dockState[key].w=Math.round(w);dockState[key].h=Math.round(h);relayout();
  };
  const up=ev=>{try{handle.releasePointerCapture(ev.pointerId);}catch(_){}
    document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);saveLayout();};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
}
function makePanelsMovable(){
  // timeline is pinned to the bottom -> its grip does not drag
  $$('.panel .pgrip').forEach(g=>{const panel=g.closest('.panel');if(panel.id==='pnlTl')return;
    g.addEventListener('pointerdown',e=>startPanelDrag(panel,g,e));});
  // resize handles on gauge/tools/side
  ['pnlGauge','pnlTools','pnlSide'].forEach(id=>{const panel=$('#'+id);
    let p=panel.querySelector('.prz');if(!p){p=document.createElement('div');p.className='prz br';panel.appendChild(p);}
    p.addEventListener('pointerdown',e=>startPanelResize(panel,p,e));});

  $$('.panel').forEach(panel=>{
    if(panel.id==='pnlTl')return;   // timeline stays docked at the bottom
    panel.addEventListener('pointerdown',e=>{
      if(e.target.closest('.pgrip,.presize,.prz,button,input,select,textarea,.g-track,.tl-scroll,.palette,canvas,[contenteditable]'))return;
      const sx=e.clientX,sy=e.clientY;
      const t=setTimeout(()=>{clr();startPanelDrag(panel,panel,e);},420);
      function mv(ev){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>8)clr();}
      function clr(){clearTimeout(t);panel.removeEventListener('pointermove',mv);panel.removeEventListener('pointerup',clr);panel.removeEventListener('pointercancel',clr);}
      panel.addEventListener('pointermove',mv);panel.addEventListener('pointerup',clr);panel.addEventListener('pointercancel',clr);
    });
  });
  // timeline vertical resize (drag the top edge)
  $$('.presize').forEach(h=>{const panel=h.closest('.panel');
    h.addEventListener('pointerdown',e=>{e.preventDefault();try{h.setPointerCapture(e.pointerId);}catch(_){}
      const startY=e.clientY,startH=panel.getBoundingClientRect().height;
      const move=ev=>{dockState.tl.h=Math.max(90,Math.min(workspace.clientHeight-40,startH-(ev.clientY-startY)));relayout();};
      const up=ev=>{try{h.releasePointerCapture(ev.pointerId);}catch(_){}
        document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);saveLayout();};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);});
  });
}
function initLayout(){const saved=loadLayout();dockState=saved||defaultDock();
