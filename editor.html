/* ---- Aseprite (.ase / .aseprite) importer ---- */
async function inflateZlib(bytes){
  if(!('DecompressionStream' in window))throw new Error('この端末は解凍(DecompressionStream)に非対応');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function loadAse(ab){
  const dv=new DataView(ab), bytes=new Uint8Array(ab); let o=0;
  const u8=()=>dv.getUint8(o++);
  const u16=()=>{const v=dv.getUint16(o,true);o+=2;return v;};
  const i16=()=>{const v=dv.getInt16(o,true);o+=2;return v;};
  const u32=()=>{const v=dv.getUint32(o,true);o+=4;return v;};
  const str=()=>{const n=u16();let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(u8());return s;};
  u32(); const magic=u16(); if(magic!==0xA5E0)throw new Error('Asepriteファイルではありません');
  const nFrames=u16(), w=u16(), h=u16(), depth=u16();
  u32(); u16(); u32(); u32(); const transIndex=u8(); o+=3; u16(); u8(); u8();
  o=128;
  const palette=[]; const aseLayers=[]; const ourLayers=[]; const frameDur=[];
  const tasks=[];
  for(let f=0; f<nFrames; f++){
    const frameStart=o; const frameBytes=u32(); u16(); const oldN=u16(); const dur=u16(); o+=2; const newN=u32();
    const nChunks=newN||oldN; frameDur[f]=dur||125;
    for(let c=0;c<nChunks;c++){
      const chunkStart=o; const chunkSize=u32(); const type=u16();
      if(type===0x2004){ // layer
        const lflags=u16(), ltype=u16(); u16(); u16(); u16(); u16(); const lop=u8(); o+=3; const nm=str();
        if(ltype===0){aseLayers.push(ourLayers.length);
          ourLayers.push({id:uid(),name:nm||('レイヤー '+(ourLayers.length+1)),visible:!!(lflags&1),opacity:lop,locked:false});}
        else aseLayers.push(null);
      }else if(type===0x2019){ // palette
        u32(); const first=u32(); const last=u32(); o+=8;
        for(let i=first;i<=last;i++){const pf=u16();const r=u8(),g=u8(),b=u8(),a=u8();if(pf&1)str();palette[i]=[r,g,b,a];}
      }else if(type===0x0004||type===0x0011){ // old palette
        const nPk=u16();let idx=0;
        for(let p=0;p<nPk;p++){idx+=u8();let cnt=u8();if(cnt===0)cnt=256;
          for(let k=0;k<cnt;k++){const r=u8(),g=u8(),b=u8();palette[idx++]=[r,g,b,255];}}
      }else if(type===0x2005){ // cel
        const li=u16(); const x=i16(); const y=i16(); u8(); const ct=u16(); o+=7;
        if(ct===0||ct===2){const cw=u16(), ch=u16();
          tasks.push({li,frame:f,x,y,cw,ch,ct,raw:bytes.slice(o,chunkStart+chunkSize)});}
        else if(ct===1){const link=u16();tasks.push({li,frame:f,link});}
      }
      o=chunkStart+chunkSize;
    }
    o=frameStart+frameBytes;
  }
  // Build cel buffers (inflate compressed ones)
  const celBuf=new Map();
  for(const t of tasks){
    if(t.link!==undefined)continue;
    const src=t.ct===2?await inflateZlib(t.raw):t.raw;
    const buf=new Uint32Array(w*h);
    blitAse(buf,src,t.x,t.y,t.cw,t.ch,depth,palette,transIndex,w,h);
    celBuf.set(t.li+':'+t.frame,buf);
  }
  for(const t of tasks){if(t.link!==undefined){const s=celBuf.get(t.li+':'+t.link);if(s)celBuf.set(t.li+':'+t.frame,s.slice());}}
  // Commit into the document model
  W=w;H=h;
  doc={layers:ourLayers.length?ourLayers:[{id:uid(),name:'レイヤー 1',visible:true,opacity:255,locked:false}],
       frames:[],cels:new Map()};
  for(let f=0;f<nFrames;f++)doc.frames.push({id:uid(),duration:frameDur[f]||125});
  for(const [key,buf] of celBuf){const [li,fr]=key.split(':').map(Number);const our=aseLayers[li];
    if(our==null)continue;doc.cels.set(doc.layers[our].id+':'+fr,buf);}
  if(palette.length){const p=palette.filter(Boolean).map(c=>'#'+[c[0],c[1],c[2]].map(v=>v.toString(16).padStart(2,'0')).join(''));
    palette2set(p);}
  activeLayer=doc.layers.length-1;activeFrame=0;undoStack=[];redoStack=[];selection=null;
  ensureComp();$('#docsize').textContent=W+'×'+H;fitView();refreshTimeline();render();updateUndoUI();
  toast('Asepriteを読み込みました '+w+'×'+h+' / '+nFrames+'フレーム');
}
function blitAse(buf,src,x,y,cw,ch,depth,palette,transIndex,W,H){

      const si=yy*cw+xx;let r,g,b,a;
      if(depth===32){const p=si*4;r=src[p];g=src[p+1];b=src[p+2];a=src[p+3];}
      else if(depth===16){const p=si*2;r=g=b=src[p];a=src[p+1];}
      else{const idx=src[si];if(idx===transIndex){continue;}const c=palette[idx]||[0,0,0,255];r=c[0];g=c[1];b=c[2];a=c[3];}
      if(!a)continue;buf[ty*W+tx]=rgba(r,g,b,a);
    }
  }
}
function palette2set(hexes){
  const seen=new Set();const out=[];
  for(const h of hexes){if(!seen.has(h)){seen.add(h);out.push(h);}if(out.length>=48)break;}
  if(out.length){palette=['#00000000',...out];activeSwatch=1;renderPalette();}
}
window.addEventListener('load',()=>{try{const bridge=sessionStorage.getItem('pxbridge');
  if(bridge){sessionStorage.removeItem('pxbridge');const img=new Image();
    img.onload=()=>{newDoc(img.width,img.height);const cel=new Uint32Array(W*H);
      const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tc=tmp.getContext('2d');tc.drawImage(img,0,0);
      const d=tc.getImageData(0,0,W,H).data;for(let i=0;i<W*H;i++)cel[i]=rgba(d[i*4],d[i*4+1],d[i*4+2],d[i*4+3]);
      doc.cels.set(celKey(doc.layers[0].id,0),cel);refreshTimeline();render();toast('変換ツールから取り込みました');};
    img.src=bridge;}}catch(_){}});

/* ================= Save / Load ================= */
function b64FromU32(u32){const u8=new Uint8Array(u32.buffer);let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
function u32FromB64(b64){const s=atob(b64);const u8=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u8[i]=s.charCodeAt(i);return new Uint32Array(u8.buffer);}
function saveProject(){const cels={};doc.cels.forEach((v,k)=>cels[k]=b64FromU32(v));
  const data={ver:1,W,H,palette,layers:doc.layers,frames:doc.frames,cels,activeLayer,activeFrame};
  downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'pixel-'+Date.now()+'.pxproj');toast('保存しました');}
$('#fileProj').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);W=d.W;H=d.H;doc={layers:d.layers,frames:d.frames,cels:new Map()};
    for(const k in d.cels)doc.cels.set(k,u32FromB64(d.cels[k]));palette=d.palette||DEFAULT_PAL.slice();
    activeLayer=d.activeLayer||0;activeFrame=d.activeFrame||0;
    nextId=Math.max(...doc.layers.map(l=>l.id),...doc.frames.map(f=>f.id),0)+1;
    undoStack=[];redoStack=[];selection=null;ensureComp();$('#docsize').textContent=W+'×'+H;
    fitView();renderPalette();refreshTimeline();render();updateUndoUI();toast('読み込みました');}
    catch(err){toast('読み込み失敗');console.error(err);}};
  rd.readAsText(f);e.target.value='';};

/* ================= Export ================= */
function frameToCanvas(fi,scale=1){const c=document.createElement('canvas');c.width=W*scale;c.height=H*scale;
  const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;compositeFrame(fi,tmp.getContext('2d'));
  ctx.drawImage(tmp,0,0,W,H,0,0,W*scale,H*scale);return c;}
function exportPNG(){const s=exportScale();if(!s)return;frameToCanvas(activeFrame,s).toBlob(b=>{downloadBlob(b,'frame-'+(activeFrame+1)+'.png');toast('PNG書き出し');});}
function exportSheet(){const s=exportScale();if(!s)return;const n=doc.frames.length;
  const c=document.createElement('canvas');c.width=W*s*n;c.height=H*s;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
  for(let i=0;i<n;i++)ctx.drawImage(frameToCanvas(i,s),i*W*s,0);c.toBlob(b=>{downloadBlob(b,'spritesheet.png');toast(n+'枚のシート書き出し');});}
function exportScale(){const s=prompt('拡大倍率（1〜32）',W<=64?'8':'4');if(s===null)return null;return Math.max(1,Math.min(32,parseInt(s)||1));}
// Export every frame as numbered PNGs, packed into a ZIP (store, no deflate).
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const enc=new TextEncoder();const parts=[],central=[];let off=0;
  for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,0x03,0x04,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    central.push(new Uint8Array([0x50,0x4b,0x01,0x02,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;}
  let cenSize=0;central.forEach(c=>cenSize+=c.length);
  const end=new Uint8Array([0x50,0x4b,0x05,0x06,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}
async function exportSeq(){const s=exportScale();if(!s)return;toast('連番PNG生成中…');
  const files=[];
  for(let i=0;i<doc.frames.length;i++){const c=frameToCanvas(i,s);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    files.push({name:'frame-'+String(i+1).padStart(3,'0')+'.png',data:new Uint8Array(await blob.arrayBuffer())});}
  downloadBlob(zipStore(files),'frames.zip');toast(files.length+'枚をZIPで書き出し');}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportGIF(){if(doc.frames.length<1)return;const scale=exportScale();if(!scale)return;toast('GIF生成中…');
  setTimeout(()=>{const delay=Math.round(1000/(+$('#fps').value||8));const frames=[];
    for(let i=0;i<doc.frames.length;i++){const c=frameToCanvas(i,scale);frames.push(c.getContext('2d').getImageData(0,0,c.width,c.height));}
    const gif=encodeGIF(frames,W*scale,H*scale,delay);downloadBlob(new Blob([gif],{type:'image/gif'}),'animation.gif');toast('GIF書き出し完了');},30);}
function encodeGIF(frames,w,h,delayMs){const bytes=[];
  const push=(...a)=>{for(const v of a)bytes.push(v&255);};const pushStr=s=>{for(let i=0;i<s.length;i++)bytes.push(s.charCodeAt(i));};
  const pushShort=v=>{bytes.push(v&255,(v>>8)&255);};
  pushStr('GIF89a');pushShort(w);pushShort(h);push(0x00,0,0);
  push(0x21,0xFF,0x0B);pushStr('NETSCAPE2.0');push(0x03,0x01);pushShort(0);push(0x00);
  const delay=Math.max(2,Math.round(delayMs/10));
  for(const fr of frames){const q=quantize(fr.data,w,h);
    push(0x21,0xF9,0x04);push(q.transIndex>=0?0x09:0x00);pushShort(delay);push(q.transIndex>=0?q.transIndex:0,0x00);
    push(0x2C);pushShort(0);pushShort(0);pushShort(w);pushShort(h);
    let bits=Math.max(1,Math.ceil(Math.log2(q.palette.length)));const size=1<<bits;
    push(0x80|(bits-1));for(let i=0;i<size;i++){const c=q.palette[i]||[0,0,0];push(c[0],c[1],c[2]);}
    const lzw=lzwEncode(q.indices,bits);push(bits);
    for(let i=0;i<lzw.length;i+=255){const chunk=lzw.slice(i,i+255);push(chunk.length);for(const b of chunk)push(b);}
    push(0x00);}
  push(0x3B);return new Uint8Array(bytes);}
function quantize(data,w,h){const n=w*h;const pixels=[];const transMask=new Uint8Array(n);
  for(let i=0;i<n;i++){const a=data[i*4+3];if(a<128){transMask[i]=1;continue;}pixels.push([data[i*4],data[i*4+1],data[i*4+2]]);}
  let pal=medianCut(pixels,255);if(pal.length===0)pal=[[0,0,0]];
  let has=false;for(let i=0;i<n;i++)if(transMask[i]){has=true;break;}
  const transIndex=has?pal.length:-1;if(has)pal.push([0,0,0]);
  const indices=new Uint8Array(n);
  for(let i=0;i<n;i++){if(transMask[i]){indices[i]=transIndex;continue;}indices[i]=nearest(pal,data[i*4],data[i*4+1],data[i*4+2],transIndex);}
  return {palette:pal,indices,transIndex};}
function nearest(pal,r,g,b,skip){let best=0,bd=1e9;for(let i=0;i<pal.length;i++){if(i===skip)continue;
  const c=pal[i];const d=(c[0]-r)**2+(c[1]-g)**2+(c[2]-b)**2;if(d<bd){bd=d;best=i;}}return best;}
function medianCut(pixels,maxColors){if(pixels.length===0)return [];let boxes=[pixels];
  while(boxes.length<maxColors){let bi=-1,brange=-1,bchan=0;
    for(let i=0;i<boxes.length;i++){const box=boxes[i];if(box.length<2)continue;const r=channelRange(box);if(r.range>brange){brange=r.range;bi=i;bchan=r.chan;}}
    if(bi<0)break;const box=boxes[bi];box.sort((a,b)=>a[bchan]-b[bchan]);const mid=box.length>>1;boxes.splice(bi,1,box.slice(0,mid),box.slice(mid));}
  return boxes.map(box=>{const s=[0,0,0];for(const p of box){s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];}const n=box.length||1;return [Math.round(s[0]/n),Math.round(s[1]/n),Math.round(s[2]/n)];});}
function channelRange(box){const mn=[255,255,255],mx=[0,0,0];
  for(const p of box)for(let c=0;c<3;c++){if(p[c]<mn[c])mn[c]=p[c];if(p[c]>mx[c])mx[c]=p[c];}
  let chan=0,range=-1;for(let c=0;c<3;c++){const r=mx[c]-mn[c];if(r>range){range=r;chan=c;}}return {chan,range};}
function lzwEncode(indices,minCodeSize){const clearCode=1<<minCodeSize,eoiCode=clearCode+1;let codeSize=minCodeSize+1;
  let dict,next;const resetDict=()=>{dict=new Map();for(let i=0;i<clearCode;i++)dict.set(String(i),i);next=eoiCode+1;codeSize=minCodeSize+1;};
  const out=[];let cur=0,curBits=0;const emit=code=>{cur|=code<<curBits;curBits+=codeSize;while(curBits>=8){out.push(cur&255);cur>>=8;curBits-=8;}};
  resetDict();emit(clearCode);let w=String(indices[0]);
  for(let i=1;i<indices.length;i++){const c=String(indices[i]);const wc=w+','+c;
    if(dict.has(wc)){w=wc;}else{emit(dict.get(w));dict.set(wc,next++);if(next>(1<<codeSize)&&codeSize<12)codeSize++;if(next>=4096){emit(clearCode);resetDict();}w=c;}}
  emit(dict.get(w));emit(eoiCode);if(curBits>0)out.push(cur&255);return out;}

/* ================= Boot ================= */
function boot(){
  initLayout();initWheel();
  newDoc(32,32);setTool('pencil');updateGauge();updateSelBtns();$('#selSec').style.display='none';
  window.addEventListener('resize',()=>{relayout();fitView();render();});
  setInterval(()=>{if(selection||(drawing&&(tool==='select'||tool==='lasso'))){antsPhase=(antsPhase+1)%8;renderView();}},120);
  // Purge any previously-registered service worker + caches (they caused
  // stale loads). No SW is registered now: the page always loads fresh.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  }
  if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});}
}
boot();
